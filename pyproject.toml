[project]
name = "fastapi-authkit-workspace"
version = "0.1.0"
description = "Workspace root for the fastauthx package family. Not published itself; see packages/fastauthx, packages/fastauthx-orgs, packages/fastauthx-roles."
requires-python = ">=3.13"
dependencies = [
    "fastauthx[resend]",
    "fastauthx-orgs",
    "fastauthx-roles",
]

[dependency-groups]
dev = [
    "asyncpg>=0.31.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
fastauthx = { workspace = true }
fastauthx-orgs = { workspace = true }
fastauthx-roles = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
