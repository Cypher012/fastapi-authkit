[project]
name = "fastauthx-orgs"
version = "0.1.0"
description = "Multi tenant organizations, membership, and rank based role checks for fastauthx. Ships RoleEnum, get_current_membership, and require_role(min_role). No Permission enum or mapping, that stays app specific. See README."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastauthx",
    "fastapi>=0.141.1",
    "sqlmodel>=0.0.42",
]

[dependency-groups]
dev = [
    "asyncpg>=0.31.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastauthx_orgs"]

[tool.uv.sources]
fastauthx = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
