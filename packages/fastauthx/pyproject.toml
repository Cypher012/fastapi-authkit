[project]
name = "fastauthx"
version = "0.1.0"
description = "Drop in FastAPI authentication core. Password and Google OAuth, JWT access tokens, rotating refresh tokens, email verification, and password reset. Bring your own DB session and email provider."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [
    { name = "Cypher012" },
]
urls = { Homepage = "https://github.com/Cypher012/fastapi-authkit", Repository = "https://github.com/Cypher012/fastapi-authkit" }
dependencies = [
    "argon2-cffi>=25.1.0",
    "authlib>=1.8.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic[email]>=2.0",
    "pyjwt>=2.13.0",
    "sqlmodel>=0.0.42",
]

[project.optional-dependencies]
resend = ["resend[async]>=2.43.0"]

[dependency-groups]
dev = [
    "asyncpg>=0.31.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastauthx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
